services:
  mysql:
    image: mysql:8.4
    container_name: mahjong-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mahjong_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mahjong-server/src/main/resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./mahjong-server
      dockerfile: Dockerfile
    container_name: mahjong-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mahjong_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: root123
      TZ: Asia/Shanghai
    expose:
      - "8080"

  frontend:
    image: nginx:alpine
    container_name: mahjong-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./mahjong-frontend:/usr/share/nginx/html:ro
      - ./mahjong-frontend/nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

volumes:
  mysql_data:
