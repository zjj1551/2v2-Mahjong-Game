server:
  port: 8080

spring:
  application:
    name: mahjong-server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mahjong_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 开发环境自动建表；生产环境改为 validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.mahjong: DEBUG
    org.springframework.web.socket: INFO
